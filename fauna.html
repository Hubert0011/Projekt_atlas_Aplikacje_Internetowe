<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fauna | Atlas Polskich Lasów</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- header i nav-->
    <header class="main-header">
        <div class="container header-container">
            <a href="index.html" class="logo">Strona główna</a>
            <button class="hamburger" aria-label="Otwórz menu" aria-expanded="false">
                <span class="hamburger-box"><span class="hamburger-inner"></span></span>
            </button>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link">Strona Główna</a></li>
                    <li><a href="flora.html" class="nav-link">Flora i Grzyby</a></li>
                    <li><a href="fauna.html" class="nav-link active">Fauna</a></li>
                    <li><a href="kontakt.html" class="nav-link">Kontakt</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="atlas-section">
            <div class="container">
                <h1>Fauna polskich lasów</h1>
                <p>Poznaj zwierzęta zamieszkujące nasze lasy. Wybierz kategorię poniżej.</p>
                
                <!-- filtrowanie kategorii -->
                <div class="filters" id="fauna-filters">
                    <button class="filter-btn active" data-filter="all">Wszystkie</button>
                    <button class="filter-btn" data-filter="duze-ssaki">Duże ssaki</button>
                    <button class="filter-btn" data-filter="male-ssaki">Małe i średnie ssaki</button>
                    <button class="filter-btn" data-filter="ptaki">Ptaki</button>
                </div>

                <div class="grid-container" id="fauna-grid">
                    
                    

                </div>
            </div>
        </section>
    </main>

    <!--stopka -->
    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2026 Atlas Polskich lasów.</p>
            <p>
                Autor: Hubert Chomicz | 
                <a href="https://github.com/Hubert0011/Projekt_atlas_Aplikacje_Internetowe.git" target="_blank" rel="noopener noreferrer">Repozytorium GitHub</a>
            </p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
